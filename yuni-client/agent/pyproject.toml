[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yuni-agent"
version = "0.1.0"
description = "Local Python sidecar for the Yuni desktop companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "faiss-cpu>=1.12,<2",
  "numpy>=1.26,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
yuni-agent = "yuni_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yuni_agent = ["storage/alembic/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
